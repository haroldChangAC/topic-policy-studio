[project]
name = "humanities-policy-studio"
version = "0.1.0"
description = "Local, traceable text analysis for humanities and policy research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bertopic>=0.17,<1",
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "sentence-transformers>=3.3,<6",
    "torch>=2.4,<3",
    "umap-learn>=0.5.7,<1",
    "hdbscan>=0.8.40,<1",
    "scikit-learn>=1.5,<2",
    "jieba>=0.42.1,<1",
    "plotly>=5.24,<7",
    "matplotlib>=3.9,<4",
    "huggingface-hub>=0.26,<2",
    "safetensors>=0.4,<1",
    "psutil>=6,<8",
    # jieba 0.42.1 imports pkg_resources, removed in setuptools 81.
    "setuptools>=70,<81",
]

[tool.uv]
package = false

